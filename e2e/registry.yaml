# In-cluster registry for the e2e test: holds the Hedgehog dev image (pushed by Tilt) and the patched images.
# It lives in hedgehog-system so Hedgehog's own webhooks never gate it. No auth (Hedgehog pushes anonymously), no
# persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: hedgehog-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          emptyDir: {}
---
# Fixed ClusterIP: the node's containerd mirror points at it (e2e/k3d.yaml). NodePort 30500 is mapped to the host's
# localhost:5000 for Tilt.
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: hedgehog-system
spec:
  type: NodePort
  clusterIP: 10.43.200.200
  selector: {app.kubernetes.io/name: registry}
  ports:
    - {port: 5000, targetPort: 5000, nodePort: 30500}
